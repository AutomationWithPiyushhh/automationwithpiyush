<!DOCTYPE html>
<html lang="en" class="">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locator Master | AutomationWithPiyush</title>

    <script src="js/theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        glass: {
                            light: 'rgba(255, 255, 255, 0.6)',
                            dark: 'rgba(30, 30, 40, 0.6)'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            transition-property: background-color, color;
            transition-duration: 400ms;
        }

        /* --- Theme Backgrounds & Shared Glass Styles from Main Site --- */
        :root body {
            background-color: #f0f2f6;
            color: #1c1d21;
            background-image: radial-gradient(circle at top right, rgba(250, 204, 21, 0.08), transparent 50%), radial-gradient(circle at bottom left, rgba(56, 189, 248, 0.08), transparent 50%);
            background-attachment: fixed;
        }

        .dark body {
            background-color: #12131a;
            color: #ffffff;
            background-image: radial-gradient(circle at top right, rgba(250, 204, 21, 0.04), transparent 50%), radial-gradient(circle at bottom left, rgba(56, 189, 248, 0.04), transparent 50%);
        }

        .bg-card {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        :root .bg-card {
            background-color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.04);
        }

        .dark .bg-card {
            background-color: rgba(30, 31, 40, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
        }

        .glass-input {
            transition: all 0.3s ease;
        }

        :root .glass-input {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: #1e3a8a;
            /* blue-900 */
        }

        .dark .glass-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #60a5fa;
            /* blue-400 */
        }

        .glass-input:focus {
            outline: none;
            border-color: #f59e0b;
            box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.2);
        }

        /* --- Scaled Down Code Block --- */
        .code-block {
            font-family: 'Courier New', Courier, monospace;
            border-left: 3px solid #fbbf24;
        }

        :root .code-block {
            background: rgba(30, 41, 59, 0.05);
            color: #334155;
        }

        .dark .code-block {
            background: rgba(0, 0, 0, 0.4);
            color: #cbd5e1;
            border-left-color: #f59e0b;
        }

        /* --- Animations --- */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .shake {
            animation: shake 0.3s ease-in-out;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes pointFloat {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            100% {
                opacity: 0;
                transform: translateY(-30px) scale(1.2);
            }
        }

        .point-float {
            position: absolute;
            color: #10b981;
            font-weight: bold;
            font-size: 0.9rem;
            animation: pointFloat 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 50;
        }

        @keyframes successGlow {
            0% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4);
                transform: scale(1);
            }

            50% {
                box-shadow: 0 0 0 10px rgba(34, 197, 94, 0);
                transform: scale(1.01);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
                transform: scale(1);
            }
        }

        .success-glow {
            animation: successGlow 0.5s ease-out;
            border-color: rgba(34, 197, 94, 0.5) !important;
        }

        @keyframes errorFlash {
            0% {
                border-color: #f87171;
            }

            50% {
                border-color: #ef4444;
            }

            100% {
                border-color: inherit;
            }
        }

        .error-flash {
            animation: errorFlash 0.4s ease-out;
        }

        @keyframes skipTransition {
            0% {
                opacity: 1;
                transform: translateX(0) scale(1);
            }

            50% {
                opacity: 0;
                transform: translateX(-30px) scale(0.98);
                filter: grayscale(100%);
            }

            51% {
                opacity: 0;
                transform: translateX(30px) scale(0.98);
            }

            100% {
                opacity: 1;
                transform: translateX(0) scale(1);
                filter: grayscale(0%);
            }
        }

        .skip-anim {
            animation: skipTransition 0.5s ease-in-out forwards;
        }

        .level-up-anim {
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center pt-4 pb-10">

    <div class="w-full max-w-4xl px-4 flex justify-between items-center mb-6 z-50">
        <a href="index.html"
            class="flex items-center gap-2 text-slate-600 dark:text-gray-400 hover:text-amber-500 dark:hover:text-amber-400 transition-all text-xs font-semibold bg-white/40 dark:bg-black/30 px-3 py-1.5 rounded-full border border-white/50 dark:border-white/10 backdrop-blur-md">
            <i class="fa-solid fa-arrow-left"></i> Back to Hub
        </a>
        <button id="theme-toggle"
            class="w-7 h-7 rounded-full bg-white/40 dark:bg-black/40 backdrop-blur-md shadow-sm border border-white/50 dark:border-white/10 flex items-center justify-center transition-all hover:scale-110"
            onclick="toggleTheme()">
            <i class="fas fa-moon dark:hidden text-slate-800 text-[10px]"></i>
            <i class="fas fa-sun hidden dark:block text-amber-400 text-[10px]"></i>
        </button>
    </div>

    <main class="w-11/12 max-w-4xl bg-card rounded-[1.5rem] p-5 md:p-8 relative z-10 pop-in" id="game-container">

        <div
            class="flex flex-col md:flex-row justify-between items-start md:items-end border-b border-slate-300/50 dark:border-gray-700/50 pb-4 mb-6">
            <div>
                <h1 class="text-xl md:text-2xl font-bold text-slate-900 dark:text-white mb-1 tracking-tight"
                    id="level-title">Loading Level...</h1>
                <p class="text-slate-500 dark:text-gray-400 text-[10px] md:text-xs font-medium uppercase tracking-widest"
                    id="level-desc">Prepare your locators.</p>
            </div>

            <div class="flex flex-row items-center space-x-2 md:space-x-3 mt-4 md:mt-0">
                <button onclick="previousLevel()" id="back-btn"
                    class="text-slate-500 dark:text-gray-400 hover:text-amber-600 dark:hover:text-amber-400 text-xs font-semibold px-3 py-1.5 rounded-full bg-white/30 dark:bg-black/20 hover:bg-white/60 dark:hover:bg-black/40 transition-all flex items-center shadow-sm border border-white/40 dark:border-white/5 hidden">
                    <i class="fa-solid fa-backward-step mr-1.5 text-[10px]"></i> Back
                </button>

                <button onclick="skipLevel()" id="skip-btn"
                    class="text-slate-500 dark:text-gray-400 hover:text-amber-600 dark:hover:text-amber-400 text-xs font-semibold px-3 py-1.5 rounded-full bg-white/30 dark:bg-black/20 hover:bg-white/60 dark:hover:bg-black/40 transition-all flex items-center shadow-sm border border-white/40 dark:border-white/5">
                    Skip <i class="fa-solid fa-forward-step ml-1.5 text-[10px]"></i>
                </button>

                <div
                    class="bg-white/50 dark:bg-black/30 px-4 py-1.5 rounded-xl flex items-center space-x-3 border border-amber-200/50 dark:border-amber-500/20 shadow-inner ml-2 md:ml-0">
                    <i class="fa-solid fa-trophy text-amber-500 text-lg"></i>
                    <div>
                        <p
                            class="text-[8px] text-slate-500 dark:text-gray-400 font-bold uppercase tracking-widest leading-none mb-0.5">
                            Score</p>
                        <p class="text-lg font-bold text-slate-900 dark:text-white leading-none" id="score-display">0
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <div id="challenges-container" class="space-y-5">
        </div>

        <div id="level-complete"
            class="hidden mt-6 p-5 bg-green-50/80 dark:bg-green-900/20 border border-green-200 dark:border-green-800/50 rounded-2xl text-center pop-in backdrop-blur-sm">
            <h2 class="text-lg font-bold text-green-700 dark:text-green-400 mb-1"><i
                    class="fa-solid fa-circle-check mr-1.5"></i>Level Complete!</h2>
            <p class="text-green-600 dark:text-green-500/80 text-xs mb-4 font-medium">Excellent work! You successfully
                found all elements.</p>
            <button onclick="nextLevel()"
                class="bg-amber-400 hover:bg-amber-500 text-black text-xs font-bold py-2 px-5 rounded-full shadow-md transform transition hover:scale-105 inline-flex items-center">
                Start Next Level <i class="fa-solid fa-arrow-right ml-1.5"></i>
            </button>
        </div>

        <div id="game-complete"
            class="hidden mt-6 p-8 bg-card border border-amber-300/50 dark:border-amber-500/30 rounded-[1.5rem] text-center pop-in shadow-xl transition-all duration-500">
            <div id="final-icon-container" class="text-5xl mb-3 drop-shadow-md transform transition hover:scale-110">
                <i class="fa-solid fa-crown text-amber-500"></i>
            </div>
            <h2 id="final-title"
                class="text-2xl md:text-3xl font-bold text-slate-900 dark:text-white mb-2 tracking-tight">Automation
                Master!</h2>
            <p id="final-message"
                class="text-slate-600 dark:text-gray-300 text-xs md:text-sm mb-5 font-medium max-w-md mx-auto">You have
                successfully mastered Direct Locators, CSS Selectors, and advanced XPath Axes!</p>

            <div
                class="bg-white/40 dark:bg-black/30 border border-white/50 dark:border-white/10 rounded-2xl p-4 mb-6 inline-block shadow-inner backdrop-blur-md">
                <p class="text-slate-500 dark:text-gray-400 font-bold uppercase tracking-widest text-[9px] mb-1">Final
                    Score</p>
                <p class="text-3xl font-extrabold text-amber-600 dark:text-amber-400"><span id="final-score">0</span>
                    <span class="text-lg text-slate-400 dark:text-gray-600">/ <span id="max-score">0</span></span>
                </p>
            </div>

            <br>
            <button onclick="location.reload()"
                class="bg-slate-900 dark:bg-white hover:bg-black dark:hover:bg-amber-400 text-white dark:text-black text-xs font-bold py-2.5 px-6 rounded-full shadow-lg transform transition hover:scale-105 inline-flex items-center">
                <i class="fa-solid fa-rotate-right mr-1.5"></i> Play Again
            </button>
        </div>

    </main>

    <script>
        // --- GAME DATA ---
        const gameData = [
            {
                level: 1,
                title: "Level 1: The Basics",
                desc: "Master the direct locators: id, name, and linkText.",
                challenges: [
                    {
                        id: "l1-c1",
                        instruction: "Find the username input field using its <strong>ID</strong>.",
                        htmlSnippet: `<input id="user-login" type="text" placeholder="Username">`,
                        elementHtml: `<input type="text" placeholder="Username" class="border border-slate-300 dark:border-gray-600 p-1.5 rounded w-full bg-slate-50 dark:bg-gray-800 text-slate-400 dark:text-gray-500 text-xs" disabled>`,
                        expectedType: "id",
                        expectedValues: ["user-login"],
                        placeholder: "By.id(...)"
                    },
                    {
                        id: "l1-c2",
                        instruction: "Find the submit button using its <strong>Name</strong>.",
                        htmlSnippet: `<button name="submit_action">Submit</button>`,
                        elementHtml: `<button class="bg-blue-600 text-white px-3 py-1.5 rounded text-xs opacity-75 cursor-not-allowed">Submit</button>`,
                        expectedType: "name",
                        expectedValues: ["submit_action"],
                        placeholder: "By.name(...)"
                    },
                    {
                        id: "l1-c3",
                        instruction: "Find the link using exact <strong>Link Text</strong>.",
                        htmlSnippet: `<a href="/dashboard">Go to Dashboard</a>`,
                        elementHtml: `<a href="#" class="text-blue-600 dark:text-blue-400 underline text-xs font-medium cursor-not-allowed pointer-events-none">Go to Dashboard</a>`,
                        expectedType: "linkText",
                        expectedValues: ["Go to Dashboard"],
                        placeholder: "By.linkText(...)"
                    }
                ]
            },
            {
                level: 2,
                title: "Level 2: Partial Text",
                desc: "Sometimes full text is too long or dynamic. Use partialLinkText.",
                challenges: [
                    {
                        id: "l2-c1",
                        instruction: "Find this link using <strong>Partial Link Text</strong> (Target the word 'Terms').",
                        htmlSnippet: `<a href="/terms">Click here to read our Terms and Conditions</a>`,
                        elementHtml: `<a href="#" class="text-blue-600 dark:text-blue-400 hover:text-blue-800 text-xs cursor-not-allowed pointer-events-none">Click here to read our Terms and Conditions</a>`,
                        expectedType: "partialLinkText",
                        expectedValues: ["Terms", "Terms and", "Terms and Conditions"],
                        placeholder: "By.partialLinkText(...)"
                    }
                ]
            },
            {
                level: 3,
                title: "Level 3: CSS Selectors",
                desc: "Target elements using classes and CSS relationships.",
                challenges: [
                    {
                        id: "l3-c1",
                        instruction: "Find this input using a <strong>CSS Selector</strong> targeting its class name.",
                        htmlSnippet: `<input class="search-box" type="text">`,
                        elementHtml: `<input type="text" class="border border-slate-300 dark:border-gray-600 p-1.5 rounded w-full bg-slate-50 dark:bg-gray-800 text-slate-400 dark:text-gray-500 text-xs" disabled placeholder="Search...">`,
                        expectedType: "cssSelector",
                        expectedValues: [".search-box", "input.search-box", "[class='search-box']", "input[class='search-box']", "input[type = 'text']"],
                        placeholder: "By.cssSelector(...)"
                    }
                ]
            },
            {
                level: 4,
                title: "Level 4: XPath Masterclass",
                desc: "The ultimate weapon. Master attributes, text, contains, and axes.",
                challenges: [
                    {
                        id: "l4-c1",
                        instruction: "1. XPath by <strong>Attribute</strong>. Target the placeholder.",
                        htmlSnippet: `<input placeholder="Enter City">`,
                        elementHtml: `<input type="text" placeholder="Enter City" class="border border-slate-300 dark:border-gray-600 p-1.5 rounded w-full bg-slate-50 dark:bg-gray-800 text-slate-400 dark:text-gray-500 text-xs" disabled>`,
                        expectedType: "xpath",
                        expectedValues: ["//input[@placeholder='Enter City']"],
                        placeholder: "By.xpath(...)"
                    },
                    {
                        id: "l4-c2",
                        instruction: "2. XPath by <strong>Text Function</strong>. Target the visible text.",
                        htmlSnippet: `<button>Register Now</button>`,
                        elementHtml: `<button class="bg-indigo-600 text-white px-3 py-1.5 rounded text-xs opacity-75">Register Now</button>`,
                        expectedType: "xpath",
                        expectedValues: ["//button[text()='Register Now']"],
                        placeholder: "By.xpath(...)"
                    },
                    {
                        id: "l4-c3",
                        instruction: "3. XPath by <strong>Contains()</strong>. The class name is dynamic (e.g., success-123). Target the word 'success'.",
                        htmlSnippet: `<div class="msg-success-9847">Saved Successfully</div>`,
                        elementHtml: `<div class="bg-green-100 dark:bg-green-900/30 text-green-800 dark:text-green-400 border border-green-200 dark:border-green-800 p-1.5 rounded w-full text-xs text-center font-medium">Saved Successfully</div>`,
                        expectedType: "xpath",
                        expectedValues: ["//div[contains(@class,'success')]", "//div[contains(@class,'msg-success')]"],
                        placeholder: "By.xpath(...)"
                    },
                    {
                        id: "l4-c4",
                        instruction: "4. XPath by <strong>Multiple Attributes</strong>. Ensure it's type='submit' AND value='Save'.",
                        htmlSnippet: `<input type="submit" value="Save" class="btn">`,
                        elementHtml: `<input type="button" value="Save" class="bg-slate-800 dark:bg-gray-700 text-white px-4 py-1.5 rounded text-xs" disabled>`,
                        expectedType: "xpath",
                        expectedValues: ["//input[@type='submit' and @value='Save']", "//input[@value='Save' and @type='submit']"],
                        placeholder: "By.xpath(...)"
                    },
                    {
                        id: "l4-c5",
                        instruction: "5. XPath by <strong>Surroundings</strong>. Find the 'Apple' span inside 'fruit-box'.",
                        htmlSnippet: `<div id="fruit-box">\n  <span class="item">Apple</span>\n</div>\n<div id="veg-box">\n  <span class="item">Apple</span>\n</div>`,
                        elementHtml: `
                            <div class="flex space-x-2 w-full text-[10px]">
                                <div class="border border-green-400 dark:border-green-600 p-1.5 rounded text-center flex-1"><span class="text-[9px] text-green-600 dark:text-green-400 block mb-0.5">#fruit-box</span><span class="bg-red-100 dark:bg-red-900/40 text-red-800 dark:text-red-400 px-1.5 py-0.5 rounded inline-block">Apple (Target)</span></div>
                                <div class="border border-slate-300 dark:border-gray-600 p-1.5 rounded text-center opacity-50 flex-1"><span class="text-[9px] text-slate-500 dark:text-gray-400 block mb-0.5">#veg-box</span><span class="bg-red-100 dark:bg-red-900/40 text-red-800 dark:text-red-400 px-1.5 py-0.5 rounded inline-block">Apple</span></div>
                            </div>
                        `,
                        expectedType: "xpath",
                        expectedValues: ["//div[@id='fruit-box']/span", "//div[@id='fruit-box']//span", "//div[@id='fruit-box']//span[@class='item']", "//div[@id='fruit-box']/span[@class='item']"],
                        placeholder: "By.xpath(...)"
                    },
                    {
                        id: "l4-c6",
                        instruction: "6. XPath by <strong>Axes</strong>. Target the 'Delete' button exactly for 'Jane'.",
                        htmlSnippet: `<tr>\n  <td>Jane</td>\n  <td><button>Delete</button></td>\n</tr>`,
                        elementHtml: `
                            <div class="border border-slate-200 dark:border-gray-700 rounded p-1.5 bg-white dark:bg-gray-800 w-full text-[10px]">
                                <div class="flex justify-between border-b border-slate-100 dark:border-gray-700 p-1 opacity-50 text-slate-700 dark:text-gray-300"><span>John</span><button class="text-red-500">Delete</button></div>
                                <div class="flex justify-between p-1 bg-amber-50 dark:bg-amber-900/20 text-slate-800 dark:text-white rounded"><span>Jane</span><button class="text-red-600 dark:text-red-400 font-bold border border-red-200 dark:border-red-800/50 px-1.5 rounded">Delete (Target)</button></div>
                            </div>
                        `,
                        expectedType: "xpath",
                        expectedValues: ["//td[text()='Jane']/../td/button", "//td[text()='Jane']/following-sibling::td/button", "//td[text()='Jane']/following-sibling::td//button"],
                        placeholder: "By.xpath(...)"
                    }
                ]
            }
        ];

        // --- GAME STATE ---
        let currentLevelIndex = 0;
        let score = 0;
        let completedChallengesInLevel = 0;
        let maxScore = 0;

        // --- CORE LOGIC ---

        function initGame() {
            maxScore = gameData.reduce((total, level) => total + (level.challenges.length * 10), 0);
            document.getElementById('max-score').innerText = maxScore;
            loadLevel(currentLevelIndex);
        }

        function loadLevel(index) {
            const levelData = gameData[index];
            document.getElementById('level-title').innerText = levelData.title;
            document.getElementById('level-desc').innerText = levelData.desc;

            const container = document.getElementById('challenges-container');
            container.innerHTML = '';
            completedChallengesInLevel = 0;

            document.getElementById('level-complete').classList.add('hidden');
            document.getElementById('game-complete').classList.add('hidden');
            document.getElementById('skip-btn').classList.remove('hidden');

            if (index === 0) {
                document.getElementById('back-btn').classList.add('hidden');
            } else {
                document.getElementById('back-btn').classList.remove('hidden');
            }

            levelData.challenges.forEach((ch, i) => {
                const delay = i * 0.08;
                const escapedSnippet = ch.htmlSnippet.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");

                const challengeCard = `
                    <div class="bg-white/50 dark:bg-black/20 backdrop-blur-md border border-white/60 dark:border-white/10 rounded-2xl p-4 md:p-5 shadow-sm pop-in" style="animation-delay: ${delay}s" id="card-${ch.id}">
                        <div class="flex items-start mb-3">
                            <div class="bg-amber-100 dark:bg-amber-500/20 text-amber-600 dark:text-amber-400 w-6 h-6 rounded-lg text-xs flex items-center justify-center font-bold mr-2.5 shrink-0">${i + 1}</div>
                            <p class="text-slate-800 dark:text-white text-xs md:text-sm font-semibold leading-relaxed" style="margin-top: 2px;">${ch.instruction}</p>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4 md:pl-8">
                            <div>
                                <p class="text-[9px] text-slate-400 dark:text-gray-500 font-bold mb-1.5 uppercase tracking-wider">Target UI Element</p>
                                <div class="p-3 bg-white/70 dark:bg-[#1a1b23]/80 border border-slate-200 dark:border-white/5 rounded-xl min-h-[60px] flex items-center justify-center shadow-inner">
                                    ${ch.elementHtml}
                                </div>
                            </div>
                            <div>
                                <p class="text-[9px] text-slate-400 dark:text-gray-500 font-bold mb-1.5 uppercase tracking-wider">DOM Source Code</p>
                                <div class="code-block p-3 rounded-xl text-[10px] md:text-xs overflow-x-auto min-h-[60px] flex items-center shadow-inner w-full">
                                    <code>${escapedSnippet}</code>
                                </div>
                            </div>
                        </div>

                        <div class="md:pl-8 mt-4 relative">
                            <label class="block text-[10px] font-bold text-slate-500 dark:text-gray-400 mb-1.5 uppercase tracking-wider">Write Locator Code (Java)</label>
                            <div class="flex space-x-2">
                                <input type="text" id="input-${ch.id}" class="glass-input w-full p-2.5 rounded-xl font-mono text-xs shadow-inner" placeholder='${ch.placeholder}' onkeydown="if(event.key === 'Enter') checkAnswer('${ch.id}', '${ch.expectedType}')">
                                <button id="btn-${ch.id}" onclick="checkAnswer('${ch.id}', '${ch.expectedType}')" class="bg-amber-400 hover:bg-amber-500 text-black text-xs font-bold px-4 py-2 rounded-xl transition duration-200 flex items-center whitespace-nowrap shadow-sm">
                                    Verify <i class="fa-solid fa-check-circle ml-1.5 text-[10px]"></i>
                                </button>
                            </div>
                            <p id="error-${ch.id}" class="text-red-500 dark:text-red-400 text-[10px] mt-1.5 hidden font-medium"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Incorrect locator or syntax. Check quotes and spelling!</p>
                        </div>
                    </div>
                `;
                container.innerHTML += challengeCard;
            });
        }

        function checkAnswer(challengeId, expectedType) {
            const inputEl = document.getElementById(`input-${challengeId}`);
            const btnEl = document.getElementById(`btn-${challengeId}`);
            const cardEl = document.getElementById(`card-${challengeId}`);
            const errorEl = document.getElementById(`error-${challengeId}`);

            if (inputEl.disabled) return;

            const userInput = inputEl.value.trim();
            const challenge = gameData[currentLevelIndex].challenges.find(c => c.id === challengeId);

            if (validateLocator(userInput, challenge.expectedType, challenge.expectedValues)) {
                // Success
                errorEl.classList.add('hidden');
                inputEl.disabled = true;

                inputEl.classList.add('bg-green-50/50', 'dark:bg-green-900/30', 'text-green-800', 'dark:text-green-400');
                inputEl.classList.remove('glass-input');
                cardEl.classList.add('success-glow', 'border-green-300', 'dark:border-green-700', 'bg-green-50/20', 'dark:bg-green-900/10');

                btnEl.disabled = true;
                btnEl.innerHTML = `Correct <i class="fa-solid fa-check ml-1.5"></i>`;
                btnEl.classList.remove('bg-amber-400', 'hover:bg-amber-500');
                btnEl.classList.add('bg-green-500', 'dark:bg-green-600', 'text-white', 'scale-[1.02]');

                const rect = btnEl.getBoundingClientRect();
                const x = (rect.left + rect.width / 2) / window.innerWidth;
                const y = (rect.top + rect.height / 2) / window.innerHeight;
                confetti({
                    particleCount: 30,
                    spread: 45,
                    origin: { x, y },
                    colors: ['#22c55e', '#fbbf24', '#ffffff'],
                    disableForReducedMotion: true
                });

                addPoints(10, btnEl);
                completedChallengesInLevel++;

                checkLevelComplete();
            } else {
                // Fail
                errorEl.classList.remove('hidden');

                cardEl.classList.remove('shake');
                inputEl.classList.remove('error-flash');
                void cardEl.offsetWidth;
                cardEl.classList.add('shake');
                inputEl.classList.add('error-flash');

                inputEl.style.borderColor = '#ef4444';
                setTimeout(() => { if (!inputEl.disabled) inputEl.style.borderColor = ''; }, 400);
            }
        }

        function validateLocator(userInput, expectedType, expectedValues) {
            const match = userInput.match(/^By\.([a-zA-Z]+)\(\s*(['"])(.*?)\2\s*\)$/);
            if (!match) return false;

            const type = match[1];
            const value = match[3];

            if (type.toLowerCase() !== expectedType.toLowerCase()) return false;

            for (let expected of expectedValues) {
                const normalizedValue = value.replace(/'/g, '"');
                const normalizedExpected = expected.replace(/'/g, '"');

                if (normalizedValue === normalizedExpected) return true;
                if (value === expected) return true;
            }
            return false;
        }

        function addPoints(points, triggerElement) {
            score += points;
            const scoreEl = document.getElementById('score-display');
            scoreEl.innerText = score;
            scoreEl.classList.remove('pop-in');
            void scoreEl.offsetWidth;
            scoreEl.classList.add('pop-in', 'text-amber-500');
            setTimeout(() => scoreEl.classList.remove('text-amber-500'), 400);

            const rect = triggerElement.getBoundingClientRect();
            const floatText = document.createElement('div');
            floatText.innerText = `+${points}`;
            floatText.className = 'point-float';
            floatText.style.left = `${rect.left + (rect.width / 2)}px`;
            floatText.style.top = `${rect.top - 15}px`;
            document.body.appendChild(floatText);

            setTimeout(() => floatText.remove(), 800);
        }

        function showGameComplete() {
            document.getElementById('challenges-container').innerHTML = '';
            document.getElementById('skip-btn').classList.add('hidden');
            document.getElementById('back-btn').classList.add('hidden');
            document.getElementById('level-complete').classList.add('hidden');

            const gameCompleteEl = document.getElementById('game-complete');
            gameCompleteEl.classList.remove('hidden');
            document.getElementById('final-score').innerText = score;

            const iconContainer = document.getElementById('final-icon-container');
            const titleEl = document.getElementById('final-title');
            const messageEl = document.getElementById('final-message');

            document.getElementById('level-title').innerText = "Course Completed";
            document.getElementById('level-desc').innerText = "Here is your final performance.";

            if (score === maxScore) {
                iconContainer.innerHTML = '<i class="fa-solid fa-trophy text-amber-400 drop-shadow-[0_0_15px_rgba(250,204,21,0.5)]"></i>';
                titleEl.innerText = "Flawless Master!";
                titleEl.className = "text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500 mb-2 animate-pulse";
                messageEl.innerText = "Absolutely perfect! You found every single locator without skipping. You are a Selenium God!";

                const duration = 2500;
                const end = Date.now() + duration;
                (function frame() {
                    confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#fbbf24', '#f59e0b', '#ef4444'] });
                    confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#fbbf24', '#f59e0b', '#ef4444'] });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
            } else if (score === 0) {
                iconContainer.innerHTML = '<i class="fa-solid fa-seedling text-green-500"></i>';
                titleEl.innerText = "Every Expert Was a Beginner";
                messageEl.innerText = "You skipped the challenges, but that's okay! Locators take practice. Restart the game and try tackling them one by one. You've got this!";
            } else {
                iconContainer.innerHTML = '<i class="fa-solid fa-medal text-blue-500 dark:text-blue-400"></i>';
                titleEl.innerText = "Great Effort!";
                messageEl.innerText = "You successfully solved several locators! Review the ones you skipped and aim for a perfect score next time.";
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }
        }

        function checkLevelComplete() {
            const levelData = gameData[currentLevelIndex];
            if (completedChallengesInLevel === levelData.challenges.length) {
                if (currentLevelIndex < gameData.length - 1) {
                    setTimeout(() => {
                        document.getElementById('level-complete').classList.remove('hidden');
                        document.getElementById('skip-btn').classList.add('hidden');
                        document.getElementById('back-btn').classList.add('hidden');

                        confetti({
                            particleCount: 80,
                            spread: 60,
                            origin: { y: 0.7 },
                            colors: ['#22c55e', '#ffffff']
                        });
                    }, 400);
                } else {
                    setTimeout(() => {
                        showGameComplete();
                    }, 600);
                }
            }
        }

        function skipLevel() {
            const container = document.getElementById('game-container');
            container.classList.add('skip-anim');

            setTimeout(() => {
                if (currentLevelIndex < gameData.length - 1) {
                    currentLevelIndex++;
                    loadLevel(currentLevelIndex);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    showGameComplete();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
                setTimeout(() => container.classList.remove('skip-anim'), 50);
            }, 250);
        }

        function previousLevel() {
            if (currentLevelIndex > 0) {
                const container = document.getElementById('game-container');
                container.classList.add('skip-anim');

                setTimeout(() => {
                    currentLevelIndex--;
                    loadLevel(currentLevelIndex);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    setTimeout(() => container.classList.remove('skip-anim'), 50);
                }, 250);
            }
        }

        function nextLevel() {
            const container = document.getElementById('game-container');
            container.classList.add('level-up-anim');

            currentLevelIndex++;
            loadLevel(currentLevelIndex);
            window.scrollTo({ top: 0, behavior: 'smooth' });

            setTimeout(() => container.classList.remove('level-up-anim'), 500);
        }

        // Start Game
        window.onload = initGame;

    </script>
</body>

</html>
