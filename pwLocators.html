<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AutomationWithPiyush Registration Portal</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 750px;
            margin: auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0, 0, 0, .2);
        }

        h1 {
            text-align: center;
            color: #0b5ed7;
        }

        img {
            display: block;
            margin: auto;
            margin-bottom: 20px;
        }

        .row {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input[type=text],
        input[type=email],
        input[type=password],
        input[type=date],
        input[type=file],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            font-size: 15px;
        }

        fieldset {
            margin-bottom: 18px;
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 6px;
        }

        legend {
            font-weight: bold;
        }

        .option {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .option input {
            width: auto;
            margin-right: 8px;
        }

        .option label {
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 25px;
            cursor: pointer;
            font-size: 15px;
        }

        .success {
            color: green;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>User Registration</h1>

        <img src="https://picsum.photos/150" alt="AutomationWithPiyush Logo" width="120">

        <form>

            <div class="row">

                <label for="fullname">Full Name</label>

                <input id="fullname" type="text" placeholder="Enter Full Name">

            </div>

            <div class="row">

                <label for="email">Email</label>

                <input id="email" type="email" placeholder="Enter your Email Address">

            </div>

            <div class="row">

                <label for="password">Password</label>

                <input id="password" type="password">

            </div>

            <div class="row">

                <label for="dob">Date of Birth</label>

                <input id="dob" type="date">

            </div>

            <fieldset>

                <legend>Gender</legend>

                <div class="option">

                    <input id="male" type="radio" name="gender" value="Male">

                    <label for="male">Male</label>

                </div>

                <div class="option">

                    <input id="female" type="radio" name="gender" value="Female">

                    <label for="female">Female</label>

                </div>

            </fieldset>

            <div class="row">

                <label for="country">Country</label>

                <select id="country" data-testid="country-dropdown">

                    <option>Select Country</option>

                    <option>India</option>

                    <option>USA</option>

                    <option>Canada</option>

                    <option>Australia</option>

                </select>

            </div>

            <fieldset>

                <legend>Skills</legend>

                <div class="option">

                    <input id="java" type="checkbox">

                    <label for="java">Java</label>

                </div>

                <div class="option">

                    <input id="selenium" type="checkbox">

                    <label for="selenium">Selenium</label>

                </div>

                <div class="option">

                    <input id="playwright" type="checkbox">

                    <label for="playwright">Playwright</label>

                </div>

            </fieldset>

            <div class="row">

                <label for="address">Address</label>

                <textarea id="address" rows="4" placeholder="Enter your Address"></textarea>

            </div>

            <div class="row">

                <label for="resume">Upload Resume</label>

                <input id="resume" type="file">

            </div>

            <div class="row">

                <span title="Password must contain at least 8 characters">
                    Hover here for Password Rules
                </span>

            </div>

            <div class="row">

                <p class="success" role="alert">

                    Registration is free for all students.

                </p>

            </div>

            <div class="row">

                <a href="#">
                    Already have an account? Login
                </a>

            </div>

            <div class="buttons">

                <button type="submit">
                    Register
                </button>

                <button type="reset">
                    Reset
                </button>

            </div>

        </form>

    </div>

</body>

</html>
