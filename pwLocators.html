<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AutomationWithPiyush Registration Portal</title>

    <style>
        body {
            font-family: Arial;
            background: #f3f4f6;
            margin: 0;
            padding: 30px;
        }

        .container {

            width: 750px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;

        }

        h1 {
            text-align: center;
            color: #0b5ed7;
        }

        img {
            display: block;
            margin: auto;
            margin-bottom: 20px;
        }

        .row {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        select,
        textarea {

            width: 100%;
            padding: 10px;
            box-sizing: border-box;

        }

        .gender {
            display: flex;
            gap: 20px;
        }

        .gender label {
            font-weight: normal;
        }

        button {

            padding: 10px 25px;
            margin-right: 15px;
            cursor: pointer;

        }

        .success {

            color: green;
            font-weight: bold;

        }
    </style>

</head>

<body>

    <div class="container">

        <h1>User Registration</h1>

        <img src="https://picsum.photos/150" alt="AutomationWithPiyush Logo" width="120">

        <form>

            <div class="row">

                <label for="fullname">
                    Full Name
                </label>

                <input id="fullname" type="text">

            </div>

            <div class="row">

                <input type="email" placeholder="Enter your Email Address">

            </div>

            <div class="row">

                <label for="password">
                    Password
                </label>

                <input id="password" type="password">

            </div>

            <div class="row">

                <label>Date of Birth</label>

                <input type="date">

            </div>

            <div class="row">

                <label>Gender</label>

                <div class="gender">

                    <label>

                        <input type="radio" name="gender">

                        Male

                    </label>

                    <label>

                        <input type="radio" name="gender">

                        Female

                    </label>

                </div>

            </div>

            <div class="row">

                <label>Country</label>

                <select data-testid="country-dropdown">

                    <option>Select Country</option>

                    <option>India</option>

                    <option>USA</option>

                    <option>Canada</option>

                    <option>Australia</option>

                </select>

            </div>

            <div class="row">

                <label>Skills</label>

                <label>

                    <input type="checkbox">

                    Java

                </label>

                <label>

                    <input type="checkbox">

                    Selenium

                </label>

                <label>

                    <input type="checkbox">

                    Playwright

                </label>

            </div>

            <div class="row">

                <label>Address</label>

                <textarea rows="4" placeholder="Enter your Address"></textarea>

            </div>

            <div class="row">

                <label>Upload Resume</label>

                <input type="file">

            </div>

            <div class="row">

                <span title="Password must contain at least 8 characters">
                    Hover here for Password Rules
                </span>

            </div>

            <div class="row">

                <p class="success">

                    Registration is free for all students.

                </p>

            </div>

            <div class="row">

                <a href="#">

                    Already have an account? Login

                </a>

            </div>

            <div class="row">

                <button type="submit">

                    Register

                </button>

                <button type="reset">

                    Reset

                </button>

            </div>

        </form>

    </div>

</body>

</html>
