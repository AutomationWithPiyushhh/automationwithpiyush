<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playwright Locator Practice</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .container {
            width: 500px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 10px 25px;
            cursor: pointer;
        }
    </style>

</head>

<body>

    <div class="container">

        <h2>User Registration</h2>

        <form>

            <!-- getByLabel() -->
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname">
            </div>

            <!-- getByPlaceholder() -->
            <div class="form-group">
                <input type="email" placeholder="Enter your Email Address">
            </div>

            <!-- getByRole() -->
            <div class="form-group">
                <button type="submit">
                    Register
                </button>
            </div>

            <!-- getByText() -->
            <div class="form-group">
                <a href="#">
                    Already have an account? Login
                </a>
            </div>

            <!-- getByAltText() -->
            <div class="form-group">
                <img src="https://picsum.photos/120" alt="Company Logo">
            </div>

            <!-- getByTitle() -->
            <div class="form-group">
                <span title="Password must contain at least 8 characters">
                    Hover here for Password Rules
                </span>
            </div>

            <!-- getByTestId() -->
            <div class="form-group">
                <select data-testid="country-dropdown">
                    <option>Select Country</option>
                    <option>India</option>
                    <option>USA</option>
                    <option>Canada</option>
                </select>
            </div>

        </form>

    </div>

</body>

</html>
