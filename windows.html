<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Multi-Window | Surgical Suite</title>
    <script src="js/theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        glass: {
                            light: 'rgba(255, 255, 255, 0.6)',
                            dark: 'rgba(30, 30, 40, 0.6)'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        :root body {
            background-color: #f0f2f6 !important;
            color: #1c1d21 !important;
            background-image: radial-gradient(circle at top right, rgba(250, 204, 21, 0.08), transparent 50%), radial-gradient(circle at bottom left, rgba(56, 189, 248, 0.08), transparent 50%);
        }

        .dark body {
            background-color: #1a1b23 !important;
            color: white !important;
        }
    </style>
</head>

<body class="relative">
    <div class="absolute top-6 right-6">
        <button id="theme-toggle"
            class="w-8 h-8 rounded-full bg-white/40 dark:bg-black/40 backdrop-blur-md shadow-sm border border-white/50 dark:border-white/10 flex items-center justify-center transition-all hover:scale-110"
            onclick="toggleTheme()">
            <i class="fas fa-moon dark:hidden text-slate-800 text-xs"></i>
            <i class="fas fa-sun hidden dark:block text-amber-400 text-xs"></i>
        </button>
    </div>

    <div class="text-center">
        <i class="fas fa-layer-group text-6xl text-amber-500 dark:text-amber-400 mb-6"></i>
        <h1 class="text-4xl font-bold mb-4 text-slate-900 dark:text-white">Multi-Window Diagnostic</h1>
        <p class="text-slate-600 dark:text-gray-400 mb-8">Test your ability to manage multiple child browser handles.</p>

        <button onclick="openWindows()"
            class="bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-8 rounded-full shadow-lg transform transition active:scale-95">
            OPEN SURGICAL MONITORS (3)
        </button>
    </div>

    <script>
        function openWindows() {
            window.open('about:blank', 'Monitor1', 'width=400,height=400');
            window.open('about:blank', 'Monitor2', 'width=400,height=400');
            window.open('about:blank', 'Monitor3', 'width=400,height=400');
        }
    </script>
</body>

</html>
